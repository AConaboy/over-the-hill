# Type-check, unit tests and a production build. Runs on every PR (this is
# the status check branch protection requires on main) and is reused by
# deploy.yml before anything is deployed.
#
# Needs no secrets, so it's safe for PRs from forks.
name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npm run build
